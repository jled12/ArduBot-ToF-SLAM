# /etc/chrony/chrony.conf
# ArduBot - Raspberry Pi = client NTP exclusif du PC
# Le PC est trouvé par mDNS : ardubot-pc.local
# AUCUNE source NTP Internet n'est utilisée directement par le Raspberry.

server ardubot-pc.local iburst minpoll 2 maxpoll 4 prefer

driftfile /var/lib/chrony/chrony.drift

# Le Raspberry peut démarrer avec une date très fausse : autoriser
# une remise à l'heure franche dès que le PC devient disponible.
makestep 0.1 -1

rtcsync

keyfile /etc/chrony/chrony.keys
ntsdumpdir /var/lib/chrony
leapsectz right/UTC
logdir /var/log/chrony
