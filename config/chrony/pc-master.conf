# /etc/chrony/chrony.conf
# ArduBot - PC Ubuntu = maître NTP du réseau local
# Avec Internet : synchronisation sur ntp.ubuntu.com.
# Sans Internet : l'horloge/RTC du PC devient la référence locale.

pool ntp.ubuntu.com iburst maxsources 4

driftfile /var/lib/chrony/chrony.drift
makestep 0.1 3
rtcsync

# Référence locale de secours pour réseau isolé.
local stratum 8

# Autoriser le Raspberry quelle que soit la plage IP box/hotspot.
allow

keyfile /etc/chrony/chrony.keys
ntsdumpdir /var/lib/chrony
leapsectz right/UTC
logdir /var/log/chrony
